services:
  infobot:
    build: .
    image: sharaga-infobot:latest
    container_name: sharaga-infobot
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - vault-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  vault-data:
